version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    restart: always
    deploy:
      resources:
        limits:
          memory: 200M # Hard limit to test OOM behavior

  predictor:
    image: python:3.11-slim
    volumes:
      - .:/app
    working_dir: /app
    command: >
      bash -c "pip install pandas scikit-learn requests && python predictor.py"
    restart: always